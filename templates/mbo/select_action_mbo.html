<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Action | MBO</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f4f6f8;
      font-size:14px;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    html, body{ height:100%; }

    /* ===== HEADER ===== */
    header{
      background:#1f2937;
      color:#fff;
      padding:15px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header h1{ margin:0; font-size:20px; }

    .back-btn{
      color:#ffffff;
      text-decoration:none;
      font-size:14px;
      cursor:pointer;
      padding:8px 12px;
      border-radius:8px;
      transition:background .2s ease, opacity .2s ease;
    }
    .back-btn:hover{
      background:rgba(255,255,255,0.12);
    }

    /* ===== MAIN ===== */
    main{
      flex:1;
      padding:20px 30px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* ===== CENTER CARDS ===== */
    .center-cards{
      display:flex;
      gap:28px;
      align-items:center;
      justify-content:center;
      width:100%;
      max-width:980px;
    }

    .big-card{
      width:420px;
      max-width:46vw;
      background:#ffffff;
      border-radius:16px;
      padding:34px 26px;
      box-shadow:0 14px 28px rgba(0,0,0,0.10);
      text-align:center;
      user-select:none;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .big-card:hover{
      transform:translateY(-2px);
      box-shadow:0 18px 36px rgba(0,0,0,0.12);
    }

    .big-title{
      font-size:22px;
      font-weight:800;
      color:#0b3bb8;
      margin:0 0 18px 0;
    }

    .big-number{
      font-size:62px;
      font-weight:900;
      color:#0b3bb8;
      margin:0;
      line-height:1;
    }

    /* ===== FOOTER ===== */
    footer{
      background:#e5e7eb;
      text-align:center;
      padding:15px;
      font-size:13px;
    }

    /* ===== BLUR ===== */
    .blur-backdrop {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(6px);
      background: rgba(255,255,255,0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 998;
    }
    body.loading .blur-backdrop {
      opacity: 1;
      pointer-events: all;
    }

    /* ===== LOADER ===== */
    .loader {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(255,255,255,0.6);
      z-index: 999;
    }
    body.loading .loader {
      display: flex;
    }

    .loader-text {
      display: flex;
      gap: 6px;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #1f2937;
    }
    .loader-text span {
      animation: jump 1.2s infinite ease-in-out;
    }
    .loader-text span:nth-child(1){animation-delay:0s}
    .loader-text span:nth-child(2){animation-delay:.1s}
    .loader-text span:nth-child(3){animation-delay:.2s}
    .loader-text span:nth-child(4){animation-delay:.3s}
    .loader-text span:nth-child(5){animation-delay:.4s}
    .loader-text span:nth-child(6){animation-delay:.5s}

    @keyframes jump {
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-15px)}
    }

    .loader-subtext {
      margin-top: 12px;
      font-size: 14px;
      color: #374151;
    }
  </style>
</head>

<body>

<header>
  <h1>🏢MBO | Select Action</h1>
  <a href="#" class="back-btn" onclick="goBackToDashboard(event)">← Back</a>
</header>

<main>
  <div class="center-cards">

    <!-- ✅ FOR OBLIGATION -->
    <div class="big-card" onclick="goToForObligation()">
      <div class="big-title">For Obligation</div>
      <div class="big-number">{{ obligation_count or 0 }}</div>
    </div>

    <!-- FOR SIGNATURE (you can wire this next) -->
    <div class="big-card" onclick="goToForSignature()">
  <div class="big-title">For Signature</div>
  <div class="big-number">{{ signature_count or 0 }}</div>
</div>


  </div>
</main>

<footer>© 2026 Document Tracking System | User Panel</footer>

<!-- BLUR -->
<div class="blur-backdrop"></div>

<!-- LOADER -->
<div class="loader">
  <div class="loader-text">
    <span>A</span><span>L</span><span>A</span><span>B</span><span>A</span><span>T</span>
  </div>
  <div class="loader-subtext" id="loaderMessage">Loading...</div>
</div>

<script>
  function showLoader(message){
    const el = document.getElementById("loaderMessage");
    if (el) el.textContent = message || "Loading...";
    document.body.classList.add("loading");
  }

  function goBackToDashboard(e){
    e.preventDefault();
    showLoader("Returning to dashboard...");
    setTimeout(() => {
      window.location.href = "{{ url_for('mbo_dashboard') }}";
      // or: window.location.href = "/mbo/dashboard";
    }, 1200);
  }

  // ✅ FOR OBLIGATION CARD
function goToForObligation(){
  showLoader("Opening For Obligation...");
  setTimeout(() => {
    window.location.href = "{{ url_for('mbo_for_obligation') }}";
  }, 1200);
}

  // ✅ FOR SIGNATURE
  function goToForSignature(){
    showLoader("Opening For Signature...");
    setTimeout(() => {
      window.location.href = "{{ url_for('mbo_for_signature') }}";
    }, 1200);
  }

</script>

</body>
</html>
