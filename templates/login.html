<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Document Tracking System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           BLUR BACKDROP
        ========================= */
        .blur-backdrop {
            position: fixed;
            inset: 0;
            backdrop-filter: blur(6px);
            background: rgba(255, 255, 255, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        body.loading .blur-backdrop {
            opacity: 1;
            pointer-events: all;
        }

        /* =========================
           LOGIN CARD
        ========================= */
        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }

        .login-container h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }

        .login-container p.subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .error-message {
            background: #ffe6e6;
            color: #c0392b;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #2980b9;
        }

        /* =========================
           LOADER OVERLAY
        ========================= */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 3;
        }

        body.loading .loader-overlay {
            display: flex;
        }

        .loader-text {
            display: flex;
            gap: 6px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #3498db;
        }

        .loader-text span {
            animation: jump 1.2s infinite ease-in-out;
        }

        .loader-text span:nth-child(1) { animation-delay: 0s; }
        .loader-text span:nth-child(2) { animation-delay: 0.1s; }
        .loader-text span:nth-child(3) { animation-delay: 0.2s; }
        .loader-text span:nth-child(4) { animation-delay: 0.3s; }
        .loader-text span:nth-child(5) { animation-delay: 0.4s; }
        .loader-text span:nth-child(6) { animation-delay: 0.5s; }

        @keyframes jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .loading-subtext {
            margin-top: 12px;
            font-size: 13px;
            color: #777;
        }

        .footer-text {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<!-- BLUR BACKGROUND -->
<div class="blur-backdrop"></div>

<div class="login-container">
    <h2>Document Tracking System</h2>
    <p class="subtitle">Please sign in to continue</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="error-message">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form method="post" id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <!-- LOADER -->
    <div class="loader-overlay">
        <div class="loader-text">
            <span>A</span>
            <span>L</span>
            <span>A</span>
            <span>B</span>
            <span>A</span>
            <span>T</span>
        </div>
        <div class="loading-subtext">Authenticating...</div>
    </div>

    <div class="footer-text">
        © {{ year if year else "2026" }} Document Tracking System
    </div>
</div>

<script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function (e) {
        e.preventDefault(); // stop instant submit
        document.body.classList.add("loading");

        setTimeout(() => {
            form.submit(); // submit after 1.5 seconds
        }, 1500);
    });
</script>

</body>
</html>
